<!DOCTYPE html>

<title>The Kumarakom Auction</title>

<link href="https://fonts.googleapis.com/css2?family=Mulish:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{
  --orange:#F37021; --orange-d:#D85A10; --maroon:#8C1D2C; --maroon-d:#6E1522;
  --cream:#FFF7F0; --paper:#FFFFFF; --ink:#2E2A2A; --muted:#6F6461; --line:#EADBD0;
  --safe:#7A9A5A; --stretch:#F3A021; --bold:#C0392B;
  --self:#8C1D2C; --people:#F37021; --bank:#3D6C8C; --society:#5C8A4E;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--cream);color:var(--ink);font-family:Mulish,system-ui,sans-serif}
button{font-family:inherit;cursor:pointer}
input,select,textarea{font-family:inherit;font-size:16px}
.top{background:linear-gradient(90deg,var(--maroon),var(--maroon-d));color:#fff;padding:12px 18px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.top .brand{font-weight:900;font-size:20px;letter-spacing:.2px}
.top .brand span{color:#FFB37A}
.top .sub{font-size:13px;opacity:.85}
.top .grow{flex:1}
.pill{display:inline-block;padding:3px 10px;border-radius:999px;font-size:12px;font-weight:700;background:rgba(255,255,255,.16);color:#fff}
.wrap{max-width:1180px;margin:0 auto;padding:18px}
.phone{max-width:520px}
.card{background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:14px;box-shadow:0 2px 8px rgba(140,29,44,.05)}
h1,h2,h3{margin:0 0 10px}
h2{font-size:20px;color:var(--maroon)}
h3{font-size:16px;color:var(--maroon)}
.muted{color:var(--muted);font-size:14px}
.btn{border:0;border-radius:12px;padding:12px 18px;font-weight:800;font-size:15px;background:var(--orange);color:#fff}
.btn:hover{background:var(--orange-d)}
.btn.sec{background:#fff;color:var(--maroon);border:2px solid var(--maroon)}
.btn.dark{background:var(--maroon)}
.btn.ghost{background:transparent;color:var(--maroon);border:1px dashed var(--line)}
.btn.sm{padding:7px 12px;font-size:13px;border-radius:10px}
.btn:disabled{opacity:.4;cursor:default}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
@media(max-width:800px){.grid2,.grid3{grid-template-columns:1fr}}
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:12px}
.field label{font-weight:700;font-size:14px}
.field input,.field select,.field textarea{border:1px solid var(--line);border-radius:10px;padding:11px;background:#fff}
.teamchips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:2px solid var(--line);background:#fff;border-radius:999px;padding:9px 14px;font-weight:700;color:var(--ink)}
.chip.on{border-color:var(--orange);background:#FFF0E5;color:var(--maroon)}
.lot{display:flex;gap:10px;align-items:center;border:1px solid var(--line);border-radius:12px;padding:10px;margin-bottom:8px;background:#fff}
.lot .num{min-width:34px;height:34px;border-radius:50%;background:var(--cream);display:flex;align-items:center;justify-content:center;font-weight:900;color:var(--maroon);border:2px solid var(--line)}
.lot .num.ranked{background:var(--orange);color:#fff;border-color:var(--orange)}
.lot .txt{flex:1;font-weight:700;font-size:15px}
.lot .meta{font-size:12px;color:var(--muted);font-weight:600}
.stepper{display:flex;align-items:center;gap:6px}
.stepper button{width:36px;height:36px;border-radius:10px;border:2px solid var(--maroon);background:#fff;color:var(--maroon);font-size:20px;font-weight:900;line-height:1}
.stepper .val{min-width:78px;text-align:center;font-weight:800}
.budgetbar{position:sticky;top:0;z-index:5;background:var(--maroon);color:#fff;border-radius:14px;padding:12px 14px;margin-bottom:12px;display:flex;justify-content:space-between;align-items:center}
.budgetbar b{font-size:20px}
.tag{display:inline-block;font-size:11px;font-weight:800;padding:2px 8px;border-radius:999px;color:#fff;text-transform:uppercase;letter-spacing:.4px}
.tag.Safe{background:var(--safe)}.tag.Stretch{background:var(--stretch)}.tag.Bold{background:var(--bold)}
.tag.Self{background:var(--self)}.tag.People{background:var(--people)}.tag.Bank{background:var(--bank)}.tag.Society{background:var(--society)}
.tag.Twist{background:#222}
.phase{display:flex;gap:6px;flex-wrap:wrap}
.phase button{border:0;border-radius:999px;padding:7px 13px;font-weight:800;font-size:13px;background:rgba(255,255,255,.15);color:#fff}
.phase button.on{background:var(--orange)}
table{border-collapse:collapse;width:100%}
th,td{text-align:left;padding:8px;border-bottom:1px solid var(--line);font-size:14px;vertical-align:middle}
th{color:var(--maroon);font-size:12px;text-transform:uppercase;letter-spacing:.4px}
td input,td select{border:1px solid var(--line);border-radius:8px;padding:7px;width:100%;font-size:14px}
.stage{background:#fff;border-radius:22px;border:1px solid var(--line);padding:28px;text-align:center;position:relative;overflow:hidden}
.stage .lotno{font-weight:900;color:var(--orange);font-size:22px;letter-spacing:1px;text-transform:uppercase}
.stage .amb{font-size:clamp(28px,4vw,52px);font-weight:900;color:var(--maroon);line-height:1.12;margin:10px 0 18px}
.stage .bid{font-size:clamp(44px,7vw,96px);font-weight:900;color:var(--ink);line-height:1}
.stage .who{font-size:clamp(20px,2.4vw,32px);font-weight:800;color:var(--orange);margin-top:6px}
.banner{display:inline-block;margin-top:14px;padding:10px 22px;border-radius:999px;background:var(--maroon);color:#fff;font-weight:900;font-size:clamp(18px,2vw,26px)}
.banner.twist{background:#1f1f1f}
.banner.sold{background:var(--society)}
.ticker{max-height:260px;overflow:auto;text-align:left}
.ctrlbar{position:fixed;left:0;right:0;bottom:0;z-index:20;background:#fff;border-top:2px solid var(--line);box-shadow:0 -6px 18px rgba(140,29,44,.10);padding:10px 18px}
.ctrlbar .in{max-width:1180px;margin:0 auto;display:flex;flex-direction:column;gap:8px}
.ctrlbar .btn{padding:10px 16px}
.ctrlbar .hammer .btn{font-size:17px;padding:12px 20px}
.wrap.hasbar{padding-bottom:190px}
.hstage{padding:14px 18px}
.kgrid .k.me{border:2px solid var(--orange);background:#FFF0E5}
.hstage .amb{font-size:clamp(20px,2.2vw,30px);margin:4px 0 6px}
.hstage .amb.long{font-size:clamp(18px,1.9vw,26px)}
.hstage .board{margin-top:10px}
.hstage .brow{padding:7px 12px;margin-bottom:6px}
.log{max-height:150px;overflow:auto}
.log .e{display:flex;justify-content:space-between;padding:6px 2px;border-bottom:1px dashed var(--line);font-weight:700;font-size:14px}
.log .e.new{color:var(--maroon);font-weight:900}
.scrollbox{max-height:200px;overflow:auto}
.cboard{display:grid;gap:6px;margin:10px auto 4px;max-width:820px;text-align:left}
.cboard.two{grid-template-columns:1fr 1fr}
.crow{display:flex;align-items:center;gap:8px;padding:5px 10px;border-radius:10px;background:#FBF3EC;border:2px solid transparent;font-weight:800}
.crow.lead{background:#FFF0E5;border-color:var(--orange)}.crow.won{background:#EAF3E4;border-color:var(--society)}
.crow .pos{color:var(--maroon);font-weight:900;min-width:20px;text-align:center}
.crow .tn{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.crow .amt{flex-shrink:0}
.crow .badge{font-size:10px;padding:1px 6px;margin-left:5px}
.cboard{min-width:0}.cboard>.crow{min-width:0}
.crow .amt{font-weight:900;font-size:clamp(15px,1.6vw,20px)}
.kgrid{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.kgrid .k{border:1px solid var(--line);border-radius:10px;padding:5px 8px;font-size:12px;font-weight:700;display:flex;justify-content:space-between;gap:6px;white-space:nowrap}
.kgrid .k b{font-size:13px;color:var(--maroon)}
.kitty{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:6px;margin-bottom:12px}
.kitty .k{background:#fff;border:1px solid var(--line);border-radius:10px;padding:7px 9px;font-size:13px;font-weight:700}
.kitty .k b{display:block;font-size:16px;color:var(--maroon)}
.kitty .k.me{border:2px solid var(--orange);background:#FFF0E5}
.hl{width:100%;font:inherit;font-size:17px;padding:12px;border:2px solid var(--line);border-radius:12px;resize:vertical}

.pulse h1{font-size:clamp(26px,3vw,40px);color:var(--maroon);margin:4px 0 2px}
.pulse .sub{color:var(--muted);font-weight:700;margin-bottom:14px}
.bars{display:flex;align-items:flex-end;gap:10px;height:330px;padding:10px 6px 0;border-bottom:2px solid var(--line);position:relative}
.bars .b{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;min-width:34px}
.bars .col{width:100%;border-radius:10px 10px 0 0;background:var(--orange);display:flex;flex-direction:column-reverse;align-items:center;gap:3px;padding:6px 3px;overflow:hidden;transition:height .5s}
.bars .col.base{background:var(--maroon)}
.bars .cnt{font-weight:900;font-size:20px;color:var(--maroon);margin-bottom:4px}
.bars .nm{font-size:11px;font-weight:800;color:#fff;background:rgba(0,0,0,.18);border-radius:6px;padding:1px 5px;white-space:nowrap;max-width:100%;overflow:hidden;text-overflow:ellipsis}
.xl{display:flex;gap:10px;padding:6px 6px 0}.xl div{flex:1;min-width:34px;text-align:center;font-weight:800;font-size:13px;color:var(--muted)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin-top:16px}
.stats .s{background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px 12px}.stats .s b{display:block;font-size:26px;color:var(--maroon)}
.cloud{display:flex;flex-wrap:wrap;justify-content:center;align-items:center;gap:6px 18px;min-height:340px;padding:24px;text-align:center;line-height:1.05}
.cloud span{font-weight:900;display:inline-block}
.hlgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:10px;margin-top:12px}
.hlgrid .h{background:#fff;border:1px solid var(--line);border-left:5px solid var(--orange);border-radius:10px;padding:12px;font-weight:700}
.finding{display:flex;gap:12px;align-items:flex-start;padding:10px 0;border-bottom:1px dashed var(--line)}
.finding .n{min-width:30px;height:30px;border-radius:50%;background:var(--maroon);color:#fff;font-weight:900;display:flex;align-items:center;justify-content:center}
.profile{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0}.profile span{background:var(--maroon);color:#fff;border-radius:999px;padding:6px 14px;font-weight:800}
.botbar{position:sticky;top:0;z-index:30;display:flex;flex-wrap:wrap;align-items:center;gap:10px;background:#2A1520;color:#fff;border-radius:12px;padding:8px 14px;margin-bottom:12px;font-weight:700}
.botbar .btn.sec{background:#fff}
.tsel{width:100%;font-size:26px;font-weight:900;text-align:center;padding:12px;border:2px solid var(--maroon);border-radius:12px;color:var(--maroon);background:#fff}
.ticker div{padding:6px 0;border-bottom:1px dashed var(--line);font-weight:700}
.teambars .tb{margin-bottom:10px}
.teambars .lab{display:flex;justify-content:space-between;font-weight:800;font-size:14px}
.bar{height:12px;border-radius:999px;background:#F3E6DC;overflow:hidden;margin-top:4px}
.bar>i{display:block;height:100%;background:var(--orange)}
.hbtns{display:flex;flex-wrap:wrap;gap:8px}
.big{font-size:56px;font-weight:900;color:var(--maroon)}
.raise{width:100%;padding:22px;font-size:22px;border-radius:16px}
.spend{display:flex;height:46px;border-radius:12px;overflow:hidden;margin:8px 0}
.spend>div{display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800;font-size:13px;white-space:nowrap;overflow:hidden}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:13px;font-weight:700}
.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.kpi{font-size:34px;font-weight:900;color:var(--maroon)}
.note{background:#FFF0E5;border-left:4px solid var(--orange);padding:10px 12px;border-radius:8px;font-size:14px}
.center{text-align:center}
.hide{display:none!important}
.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:10px;font-weight:700;z-index:50}
.member{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px dashed var(--line);font-weight:600}
.wall{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.wall .cmt{background:#FFF0E5;border-radius:12px;padding:12px;font-weight:600;border:1px solid #F6D3BC}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.tabs button{border:2px solid var(--maroon);background:#fff;color:var(--maroon);border-radius:999px;padding:7px 14px;font-weight:800}
.tabs button.on{background:var(--maroon);color:#fff}
.presenter .ctl{display:none!important}
.sticky{position:sticky;bottom:0;z-index:6;background:var(--cream);box-shadow:0 -8px 16px rgba(140,29,44,.08);padding:12px 0 10px;margin-top:6px;border-top:1px solid var(--line)}
.sticky .sum{display:flex;justify-content:space-between;font-weight:800;font-size:14px;color:var(--maroon);margin-bottom:8px}
.board{margin:18px auto 6px;max-width:760px;text-align:left}
.brow{display:grid;grid-template-columns:42px 1fr auto;align-items:center;gap:10px;padding:10px 12px;border-radius:12px;margin-bottom:8px;background:#FBF3EC;border:2px solid transparent}
.brow.lead{background:#FFF0E5;border-color:var(--orange)}
.brow.won{background:#EAF3E4;border-color:var(--society)}
.brow .pos{font-weight:900;color:var(--maroon);font-size:20px;text-align:center}
.brow .tn{font-weight:900;font-size:clamp(16px,1.8vw,22px)}
.brow .amt{font-weight:900;font-size:clamp(18px,2.2vw,28px)}
.brow .bar{grid-column:2/4;height:8px;margin-top:2px}
.badge{display:inline-block;margin-left:8px;padding:2px 9px;border-radius:999px;font-size:12px;font-weight:900;color:#fff;background:var(--orange);vertical-align:2px}
.badge.won{background:var(--society)}
.feed{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;align-items:center;margin:8px auto 0;max-width:820px}
.feed .f{padding:6px 11px;border-radius:999px;background:#fff;border:1px solid var(--line);font-weight:800;font-size:14px}
.feed .f.new{background:var(--maroon);color:#fff;border-color:var(--maroon);animation:pop .5s ease}
.feed .arr{color:var(--muted);font-weight:900}
@keyframes pop{0%{transform:scale(1.25)}100%{transform:scale(1)}}
.assign{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:12px;padding-top:12px;border-top:1px dashed var(--line)}
.assign select,.assign input{border:1px solid var(--line);border-radius:10px;padding:9px;font-size:15px}
.slide{background:#fff;border:1px solid var(--line);border-radius:22px;padding:34px 40px;min-height:68vh;display:flex;flex-direction:column;justify-content:center}
.slide h1{font-size:clamp(28px,3.4vw,46px);color:var(--maroon);margin-bottom:6px}
.slide .kick{color:var(--orange);font-weight:900;letter-spacing:1px;text-transform:uppercase;font-size:15px;margin-bottom:6px}
.slide .lead{font-size:clamp(17px,1.7vw,22px);color:var(--muted);margin-bottom:18px}
.slidenav{display:flex;justify-content:space-between;align-items:center;margin-top:12px}
@media print{.top,.tabs,.slidenav,.ctl,.toast{display:none!important}body{background:#fff}.wrap{max-width:none;padding:0}.slide{min-height:auto;border:0;page-break-after:always;padding:18px}}
</style>

// coalescing writer: one write in flight per doc, latest wins; player docs wait for a pause in tapping
const writers={};
function saveDoc(path,data,delay){
  const w=writers[path]||(writers[path]={busy:false,next:null,timer:null});
  w.next=data; if(w.busy) return;
  clearTimeout(w.timer);
  if(delay){ w.timer=setTimeout(()=>{if(!w.busy)pump(path)},delay); return }
  pump(path);
}
async function pump(path){
  const w=writers[path]; if(!w.next){w.busy=false;return}
  w.busy=true; const d=w.next; w.next=null;
  try{ await S.db.doc(path).set(d) }
  catch(e){
    if(e&&e.code==='denied'){ w.busy=false; w.next=null; toast(path.startsWith('config')?'Only the facilitator device can change the game.':'That change could be saved only by its owner.'); return }
    toast('Saving… checking the connection'); if(!w.next) w.next=d; await new Promise(r=>setTimeout(r,1500));
  }
  pump(path);
}
function writeCfg(patch){ S.cfg=Object.assign({},S.cfg,patch); saveDoc('config/game',S.cfg); render(true) }

const HOST_KEY='ambitionAuctionHost';
function hostFlag(){try{return localStorage.getItem(HOST_KEY)==='1'}catch(e){return false}}
function setHostFlag(v){try{v?localStorage.setItem(HOST_KEY,'1'):localStorage.removeItem(HOST_KEY)}catch(e){}}
function routeHost(){S.owner=hostFlag(); S.wantHost=location.hash==='#host'; S.host=S.owner&&S.wantHost}
(async function boot(){
  const timer=setTimeout(()=>{ if(!S.cfg&&!S.cfgChecked) app(`<div class="card center"><h2>Still connecting…</h2><p class="muted">The game is taking a while to reach. Please check the Wi-Fi or mobile data and refresh.</p></div>`)},10000);
  let backend;
  try{ backend=await window.backendReady }catch(e){ clearTimeout(timer); return app(`<div class="card center"><h2>Setup needed</h2><p class="muted">${esc(e.message||e)}</p></div>`) }
  S.db=backend.db; S.uid=backend.uid; S.backend=backend;
  routeHost();
  window.addEventListener('hashchange',()=>{routeHost();resubscribe();render(true)});
  S.db.doc('config/game').onSnapshot(snap=>{
    clearTimeout(timer); S.cfgChecked=true;
    if(!snap.exists){ S.cfg=null; render(true); return }
    if(S.owner && writers['config/game'] && (writers['config/game'].busy||writers['config/game'].next)) return;
    S.cfg=JSON.parse(JSON.stringify(snap.data()));
    resubscribe();
    render();
  },e=>{clearTimeout(timer);app(`<div class="card center"><h2>Game unavailable</h2><p class="muted">${esc(e.message||e.code)}</p></div>`)});
  S.db.doc('players/'+S.uid).onSnapshot(s=>{S.meDoc=s.exists?s.data():null;resubscribe();render()},()=>{});
})();

// Listeners are kept small so 60 phones stay well inside the free Firebase quota:
// a phone listens to the game, its own group and the bids; the facilitator listens to everyone.
function resubscribe(){
  if(!S.cfg) return;
  const myTeam=S.meDoc&&S.meDoc.session===S.cfg.session?S.meDoc.team:null;
  const key=[S.cfg.session,S.host?'host':'player',myTeam].join('|');
  if(S.subKey===key) return;
  const sessionChanged=!S.subKey||S.subKey.split('|')[0]!==S.cfg.session;
  S.subKey=key; S.unsubs.forEach(u=>u()); S.unsubs=[];
  S.players={}; S.teams={}; S.bids=[]; if(sessionChanged){S.draft=null;S.teamDraft=null;S.allPlayers=null}
  const ses=S.cfg.session;
  if(S.host){
    S.unsubs.push(S.db.collection('players').where('session','==',ses).onSnapshot(q=>{const m={};q.docs.forEach(d=>m[d.id]=d.data());S.players=m;render()},()=>toast('Player list unavailable')));
    S.unsubs.push(S.db.collection('teams').where('session','==',ses).onSnapshot(q=>{const m={};q.docs.forEach(d=>{const x=d.data();m[x.teamId]=x});S.teams=m;render()},()=>toast('Group plans unavailable')));
  } else if(myTeam){
    S.unsubs.push(S.db.collection('players').where('session','==',ses).where('team','==',myTeam).onSnapshot(q=>{const m={};q.docs.forEach(d=>m[d.id]=d.data());S.players=m;render()},()=>{}));
    S.unsubs.push(S.db.doc('teams/'+ses+'-'+myTeam).onSnapshot(s=>{if(s.exists){S.teams={[myTeam]:s.data()}}else S.teams={};render()},()=>{}));
  }
  S.unsubs.push(S.db.collection('bids').where('session','==',ses).onSnapshot(q=>{S.bids=q.docs.map(d=>Object.assign({_id:d.id},d.data()));render()},()=>toast('Bids unavailable')));
}
async function loadAllPlayers(){
  if(S.allPlayers||S.loadingAll) return; S.loadingAll=true;
  try{const q=await S.db.collection('players').where('session','==',S.cfg.session).get();const m={};q.docs.forEach(d=>m[d.id]=d.data());S.allPlayers=m}catch(e){S.allPlayers={}}
  S.loadingAll=false; render();
}

function bidFeed(lotId){return S.bids.filter(b=>b.lotId===lotId).sort((a,b)=>a.t-b.t)}
function lotBids(lotId){return S.bids.filter(b=>b.lotId===lotId).sort((a,b)=>b.amount-a.amount||a.t-b.t)}
function highBid(lotId){return lotBids(lotId)[0]||null}
function teamSpent(tid){let s=0;Object.entries(S.cfg.sold||{}).forEach(([lid,x])=>{if(x.team===tid)s+=x.price;if(x.runner===tid)s+=x.runnerPrice||0});return s}

function activeTeams(){const c=S.cfg;const a=c.teams.filter(t=>leaderOf(t.id)||teamSpent(t.id)>0||S.bids.some(b=>b.teamId===t.id)||(S.host&&teamMembers(t.id).length));return a.length?a:c.teams}

  const ticks=[];const st=(hi-lo)>10?5:1;for(let v=lo;v<=hi;v+=st)ticks.push(v);const tx=v=>pos(v)<18?'0':pos(v)>82?'-100%':'-50%';
  return `<div style="position:relative;height:${110+marks.length*26}px;margin:18px 8px 6px">
   <div style="position:absolute;left:0;right:0;top:40px;height:6px;border-radius:6px;background:linear-gradient(90deg,#F3E6DC,var(--orange))"></div>

function app(html){document.getElementById('app').innerHTML=html}
let pendingRender=false;
function render(force){
  const a=document.activeElement;
  const typing=a&&(a.tagName==='INPUT'&&a.type!=='button'||a.tagName==='TEXTAREA'||a.tagName==='SELECT')&&document.getElementById('app').contains(a);
  if(typing&&!force){pendingRender=true;return}
  pendingRender=false;
  const tr=document.getElementById('topRight');
  if(S.wantHost&&!S.owner){tr.innerHTML='';return app(pinView())}
  if(!S.cfg){
    tr.innerHTML='';
    if(S.host) app(`<div class="card center"><h2>Create your auction</h2><p class="muted">Start a new game with the 12 default lots. You can edit everything afterwards.</p><button class="btn" onclick="createGame()">Create game</button></div>`);
    else app(`<div class="card center"><h2>Waiting for the facilitator</h2><p class="muted">The auction will open here shortly.</p></div>`);
    return;
  }
  if(S.host) renderHost(); else renderPlayer();
}
document.addEventListener('focusout',()=>setTimeout(()=>{if(pendingRender)render()},50));

  const room=roomPrivate('whom'),rt=sumObj(room),selfP=pct(b.Self,bt),roomSelf=pct(room.Self,rt),team=shareOf(teamWon(p.team)),tr=teamRank(p.team);

function roomFindings(){
  const c=S.cfg,ps=Object.values(S.players),st=numStats(ps.map(p=>p.target).filter(hasT)),roomShare=shareOf(roomLots());
  const backed=ps.filter(p=>hasT(p.target)).filter(p=>shareOf(privateLots(p))>=p.target-0.5).length,nT=ps.filter(p=>hasT(p.target)).length;
  const sizeB={};SIZES.forEach(k=>sizeB[k]=0);Object.entries(roomBought()).forEach(([l,v])=>{const x=lotById(l);if(x)sizeB[x.size]+=v});const sb=sumObj(sizeB);
  const bought=breakdown(roomBought(),'whom'),tb=sumObj(bought),priv=roomPrivate('whom'),pt=sumObj(priv);
  const al=ps.length?Math.round(ps.reduce((a,p)=>a+alignment(p),0)/ps.length):0;
  const tl=topTwist(),ts=tl&&c.sold&&c.sold[tl.id],tws=twistLots(),twTot=tws.reduce((a,l)=>a+twistCost(l),0),twRun=tws.reduce((a,l)=>a+(((c.sold||{})[l.id]||{}).runnerPrice||0),0);
  const unsold=lots().filter(l=>!(c.sold&&c.sold[l.id]&&c.sold[l.id].team));
  const best=activeTeams().map(t=>[t.name,shareOf(teamWon(t.id))]).sort((a,b)=>b[1]-a[1])[0];

  if(nT)f.push(`Only <b>${backed} of ${nT}</b> people ranked choices that would deliver the number they wrote. The gap between stated and acted aspiration is the theme for Height.`);
  if(sb)f.push(`Of the money spent, <b>${pct(sizeB.Safe,sb)}%</b> went to Safe lots, ${pct(sizeB.Stretch,sb)}% to Stretch and ${pct(sizeB.Bold,sb)}% to Bold.`);
  if(tb)f.push(`<b>${pct(bought.Self,tb)}%</b> of team money went to Self lots (private priorities: ${pct(priv.Self,pt)}%). People lots took ${pct(bought.People,tb)}%, Bank ${pct(bought.Bank,tb)}% and Society ${pct(bought.Society,tb)}%.`);
  if(ps.length)f.push(`On average, <b>${al}%</b> of each person's top priorities reached their team's table. ${al<40?'Many voices stayed on private sheets.':'Most voices shaped the table.'}`);
  if(ts&&ts.team)f.push(tws.length>1?`The ${tws.length} twist lots cost the room <b>${fmt(twTot)}</b>, including <b>${fmt(twRun)}</b> paid by runners-up for nothing in return. The costliest was Lot ${lotNo(tl)} (${esc(shortLot(tl))}): ${fmt(twistCost(tl))}, ${tl.open?(twistCost(tl)/tl.open).toFixed(1):'—'}× its opening bid, for +${tl.impact}% of market share.`:`The twist lot cost the room <b>${fmt(twistCost(tl))}</b>, ${tl.open?(twistCost(tl)/tl.open).toFixed(1):'—'}× its opening bid, for +${tl.impact}% of market share.`);
  if(best)f.push(`<b>${esc(best[0])}</b> built the strongest position: its purchases take Kerala to <b>${best[1]}%</b>.`);
  if(unsold.length)f.push(`${unsold.length} lot${unsold.length>1?'s':''} went unclaimed: ${unsold.map(l=>'Lot '+(lots().indexOf(l)+1)+' ('+esc(shortLot(l))+')').slice(0,4).join(', ')}${unsold.length>4?' and more':''}. Ask what kept the room away from them.`);
  return f;
}
function twistLots(){return lots().filter(l=>l.twist)}
function twistCost(l){const x=(S.cfg.sold||{})[l.id];return x&&x.team?x.price+(x.runnerPrice||0):0}
function topTwist(){const t=twistLots();if(!t.length)return null;return [...t].sort((a,b)=>twistCost(b)-twistCost(a))[0]}
function lotNo(l){return lots().indexOf(l)+1}
function shortLot(l){let t=l.text.replace(/^(By April 20\d\d|Every year|Next year),\s*/i,'').split(/[:.]/)[0];t=t.charAt(0).toUpperCase()+t.slice(1);return t.length>48?t.slice(0,46).trim()+'…':t}

async function startBots(){
  S.confirmBots=false;const N=40,d=defaultConfig();
  S.bot={on:true,speed:1,paused:false,stage:'Setting up'};
  const c=Object.assign({},S.cfg,{setupVersion:SETUP_V,lots:d.lots,teams:d.teams,teamBudget:d.teamBudget,inc:d.inc,bigInc:d.bigInc,bigAt:d.bigAt,baseShare:d.baseShare,leaders:{},leaderNames:{},session:'demo'+Date.now(),phase:'lobby',current:0,lotState:'waiting',twistAnnounced:false,sold:{},revealWhom:false,revealShare:false,debriefTab:'size'});
  S.cfg=c;saveDoc('config/game',c);resubscribe();render(true);
  const T=c.teams.map(t=>t.id),L=c.lots;
  const bots=BOT_NAMES.slice(0,N).map((name,i)=>{const sz={Safe:rnd(.5,1.6),Stretch:rnd(.6,1.5),Bold:rnd(.3,1.4)},wh={Self:rnd(.3,1.6),People:rnd(.4,1.4),Bank:rnd(.6,1.6),Society:rnd(.3,1.3)};
    const rank=L.map(l=>[l.id,sz[l.size]*wh[l.whom]*rnd(.7,1.3)+(+l.impact||0)*rnd(0,.25)]).sort((a,b)=>b[1]-a[1]).map(x=>x[0]);
    const topW=Object.entries(wh).sort((a,b)=>b[1]-a[1])[0][0];
    return {uid:'bot-'+String(i+1).padStart(2,'0'),name,team:T[i%T.length],rank,target:Math.round(Math.min(40,Math.max(11,10+rnd(2,18)*(sz.Bold+sz.Stretch)/2))),headline:pick(BOT_HL[topW]),commitment:pick(BOT_CM)}});
  // 1. join
  stage('Players joining');
  for(const b of bots){if(!S.bot)return;saveDoc('players/'+b.uid,{session:c.session,name:b.name,team:b.team,t:Date.now(),rank:[],submitted:false,commitment:'',bot:true});await sleep(150)}
  await sleep(2500);
  // 2. individual sheets
  setPhase('individual');stage('Writing private sheets');await sleep(1500);
  S.pulse=true;S.pTab='numbers';S.pNames=true;render(true);
  for(const b of shuffle(bots)){if(!S.bot)return;saveDoc('players/'+b.uid,{session:c.session,name:b.name,team:b.team,t:Date.now(),rank:b.rank,target:b.target,headline:b.headline,submitted:true,commitment:'',bot:true});await sleep(rnd(250,700))}
  await sleep(4000);S.pTab='cloud';render(true);stage('Room pulse: headlines');await sleep(6000);S.pulse=false;render(true);
  // 3. leaders and priorities
  stage('Appointing leaders');const leaders={},leaderNames={};
  T.forEach(tid=>{const m=bots.filter(b=>b.team===tid);if(!m.length)return;const ld=pick(m);leaders[tid]=ld.uid;leaderNames[tid]=ld.name;
    const sc={};L.forEach(l=>sc[l.id]=0);m.forEach(b=>b.rank.forEach((id,i)=>sc[id]+=Math.max(0,8-i)));
    const tr=L.map(l=>l.id).sort((a,b)=>sc[b]-sc[a]);
    saveDoc('teams/'+c.session+'-'+tid,{teamId:tid,rank:tr,maxBid:{},session:c.session,updatedBy:S.uid})});
  writeCfg({leaders,leaderNames});await sleep(2500);
  // 4. auction
  setPhase('auction');await sleep(1500);
  const agg={};T.forEach(t=>agg[t]=rnd(.75,1.45));
  for(let i=0;i<L.length;i++){
    if(!S.bot)return;const l=L[i];writeCfg({current:i,lotState:'waiting'});stage(`Auction · lot ${i+1} of ${L.length}`);await sleep(1800);
    if(l.twist){writeCfg({twistAnnounced:true});await sleep(1500)}
    writeCfg({lotState:'open'});await sleep(1200);
    let hi=null,idle=0;
    while(S.bot){
      const next=hi?hi.amount+bidStep(hi.amount):l.open;
      const cands=T.filter(tid=>{if(hi&&hi.team===tid)return false;const left=teamLeft(tid);if(next>left)return false;
        const tr=((S.teams[tid]||{}).rank||[]),pri=Math.max(0,tr.indexOf(l.id));const remainingWanted=tr.slice(0,6).filter(id=>!(S.cfg.sold||{})[id]).length||1;
        let cap=left/remainingWanted*(pri<2?1.9:pri<4?1.3:pri<6?0.8:0.25)*agg[tid];
        if(l.twist&&hi&&lotBids(l.id).some(b=>b.teamId===tid))cap=Math.max(cap,Math.min(left*.55,hi.amount*1.6));
        return next<=cap});
      if(cands.length&&Math.random()<0.88){
        const tid=pick(cands);const jump=Math.random()<0.12?bidStep(next):0;const amt=next+jump;
        hi={team:tid,amount:amt};idle=0;
        try{await S.db.collection('bids').add({session:c.session,lotId:l.id,teamId:tid,amount:amt,uid:S.uid,host:true,bot:true,t:Date.now()})}catch(e){}
        if(S.cfg.lotState!=='open')writeCfg({lotState:'open'});
        await sleep(rnd(700,1400));
      } else {
        idle++;
        if(idle===1){writeCfg({lotState:'once'});await sleep(1600)}
        else if(idle===2){writeCfg({lotState:'twice'});await sleep(1600)}
        else {await sleep(400);sellLot();await sleep(2600);break}
      }
    }
  }
  // 5. debrief
  if(!S.bot)return;setPhase('debrief');
  for(const [k,label] of [['size','Debrief · Moment 1'],['rivalry','Debrief · Moment 2'],['voice','Debrief · Moment 3'],['reveal','Debrief · Moment 4'],['share','Debrief · Moment 5']]){
    if(!S.bot)return;stage(label);writeCfg({debriefTab:k});await sleep(3500);
    if(k==='reveal'){writeCfg({revealWhom:true});await sleep(5000)}
    if(k==='share'){writeCfg({revealShare:true});await sleep(5000)}
  }
  // 6. commitments and reports
  stage('Commitments');for(const b of bots){if(!S.bot)return;const cur=S.players[b.uid]||{};saveDoc('players/'+b.uid,Object.assign({},cur,{commitment:b.commitment}));await sleep(80)}
  setPhase('reports');S.rTab='group';stage('Demo complete · reports ready');await sleep(800);
  if(S.bot){S.bot.on=false;S.bot.done=true;render(true);toast('Bot demo complete. Open Individual reports or Present the report.')}
}

    <div class="feed" style="margin-top:16px">${bidFeed(tl.id).map((b,i)=>`${i?'<span class="arr">→</span>':''}<span class="f">${esc(teamById(b.teamId)?.name||'')} ${fmt(b.amount)}</span>`).join('')}</div>`:'<p class="muted">The twist lot results appear here once it is sold.</p>'}`,
   `<div class="kick">Movement 3</div><h1>Whose voice won?</h1><p class="lead">How closely each group's purchases matched its members' top priorities.</p>
    <table><tr><th>Group</th><th>Leader</th><th>Match with top priorities</th><th>Spent</th></tr>${c.teams.filter(t=>teamMembers(t.id).length).map(t=>{const m=teamMembers(t.id),avg=m.length?Math.round(m.reduce((a,[u,p])=>a+alignment(p),0)/m.length):0;return `<tr><td><b>${esc(t.name)}</b></td><td>${esc((S.players[leaderOf(t.id)]||{}).name||'—')}</td><td><b>${avg}%</b></td><td>${fmt(teamSpent(t.id))}</td></tr>`}).join('')}</table>`,
   `<div class="kick">Movement 4</div><h1>The Spend Map</h1><p class="lead">These aspirations had four owners: self, people, the bank and society.</p>
    <h3>Group purchases</h3>${spendBar(bought)}<h3 style="margin-top:14px">Private sheets</h3>${spendBar(priv)}${legend}${rival?`<p class="note" style="margin-top:14px">Spent on rivalry (runner-up payments): <b>${fmt(rival)}</b></p>`:''}`,
   `<div class="kick">Movement 5</div><h1>Where is Kerala now?</h1><p class="lead">We started at ${base()}%. Every lot carried a hidden market share impact.</p>
    ${(()=>{const tg=ps.map(p=>p.target).filter(hasT);const avg=tg.length?r1(tg.reduce((a,b)=>a+b,0)/tg.length):0;return shareLine([{v:shareOf(roomLots()),label:'What this room bought',c:'var(--orange)'},{v:avg,label:'Average target',c:'var(--maroon)'},{v:maxShare(),label:'All '+lots().length+' lots',c:'var(--society)'}],tg)})()}${impactTable()}`,
   `<div class="kick">Results by group</div><h1>What each group bought</h1>
    <table><tr><th>Group</th><th>Lots won</th><th>Spent</th><th>Market share</th><th>For self</th></tr>${c.teams.filter(t=>teamMembers(t.id).length||teamWon(t.id).length).map(t=>{const won=teamWon(t.id),b=breakdown(teamBought(t.id),'whom'),tot=sumObj(b);return `<tr><td><b>${esc(t.name)}</b></td><td>${won.map(l=>esc(lotById(l)?.text||'')).join('<br>')||'—'}</td><td>${fmt(teamSpent(t.id))}</td><td><b>${shareOf(won)}%</b></td><td>${pct(b.Self,tot)}%</td></tr>`}).join('')}</table>`,
   `<div class="kick">Commitments</div><h1>The Aspirations We Carry</h1><div class="wall" style="margin-top:12px">${cm.map(p=>`<div class="cmt">"${esc(p.commitment)}"<div class="muted" style="margin-top:6px">— ${esc(p.name)}</div></div>`).join('')||'<p class="muted">Commitments appear here as leaders save them on their phones.</p>'}</div>`,
   `<div class="center"><div class="kick">Closing</div><h1 style="font-size:clamp(30px,3.8vw,52px)">"Aspiration is a gift. The question is how large your aspiration is, and how many people fit inside it."</h1><p class="lead">Your role is to bring every private sheet to the table.</p></div>`
  ];
}
function presentView(){
  const sl=reportSlides();
  if(S.printAll) return sl.map(x=>`<div class="slide">${x}</div>`).join('');
  const i=Math.max(0,Math.min(sl.length-1,S.slide));S.slide=i;
  return `<div class="slide">${sl[i]}</div><div class="slidenav"><button class="btn sec" onclick="S.slide--;render(true)" ${i===0?'disabled':''}>← Previous</button><span class="muted"><b>${i+1}</b> / ${sl.length} · arrow keys work too</span><div class="row"><button class="btn ghost sm" onclick="S.slide=null;render(true)">Exit</button><button class="btn" onclick="S.slide++;render(true)" ${i===sl.length-1?'disabled':''}>Next →</button></div></div>`;
}
function printReport(){S.printAll=true;render(true);setTimeout(()=>{try{window.print()}catch(e){}S.printAll=false;render(true)},300)}
document.addEventListener('keydown',e=>{if(!S.host||S.slide==null||!S.cfg||S.cfg.phase!=='reports')return;if(e.key==='ArrowRight'||e.key===' '){S.slide++;render(true)}else if(e.key==='ArrowLeft'){S.slide=Math.max(0,S.slide-1);render(true)}else if(e.key==='Escape'){S.slide=null;render(true)}});
function groupReport(){
  const c=S.cfg,bought=breakdown(roomBought(),'whom'),priv=roomPrivate('whom'),totB=sumObj(bought),unclaimed=lots().filter(l=>c.sold&&c.sold[l.id]&&!c.sold[l.id].team),unsold=lots().filter(l=>!(c.sold&&c.sold[l.id]));
  const rival=Object.values(c.sold||{}).reduce((a,x)=>a+(x.runnerPrice||0),0);
  return findingsCard('Key findings',roomFindings())+`<div class="grid2"><div class="card"><h2>Our market share numbers</h2>${numbersChart(false)}</div><div class="card"><h2>Our April 2029 headlines</h2>${wordCloud(false)}</div></div><div class="grid3"><div class="card"><div class="kpi">${Object.keys(S.players).length}</div><div class="muted">participants</div></div><div class="card"><div class="kpi">${fmt(totB)}</div><div class="muted">spent on aspirations</div></div><div class="card"><div class="kpi">${pct(bought.Self,totB)}%</div><div class="muted">of group money went to Self ambitions</div></div></div>
  <div class="card"><h2>Room Spend Map</h2><h3>Group purchases</h3>${spendBar(bought)}<h3>Private sheets</h3>${spendBar(priv)}<div class="legend">${WHOM.map(k=>`<span><i style="background:${WCOL[k]}"></i>${k}</span>`).join('')}</div>
  ${rival?`<p class="note">Spent on rivalry (runner-up payments on the twist lots): <b>${fmt(rival)}</b></p>`:''}
  ${unclaimed.length?`<p class="note">Lots that waited in silence: ${unclaimed.map(l=>esc(l.text)).join('; ')}</p>`:''}
  ${unsold.length?`<p class="muted">Lots still to be auctioned: ${unsold.length}</p>`:''}</div>
  ${teamsBoard(t=>{const won=teamWon(t.id),b=breakdown(teamBought(t.id),'whom'),m=teamMembers(t.id),avg=m.length?Math.round(m.reduce((a,[u,p])=>a+alignment(p),0)/m.length):0;
    return `<div class="member"><span>Spent</span><b>${fmt(teamSpent(t.id))}</b></div><div class="member"><span>Market share reached</span><b>${shareOf(won)}%</b></div><div class="member"><span>Kitty left</span><b>${fmt(teamLeft(t.id))}</b></div><div class="member"><span>Priorities reaching the table</span><b>${avg}%</b></div>${spendBar(b)}<div class="muted" style="font-weight:700;margin-top:6px">Bought</div>${won.map(l=>`<div class="member"><span>${esc(lotById(l)?.text)}</span><b>${fmt(c.sold[l].price)}</b></div>`).join('')||'<p class="muted">Purchases appear here.</p>'}`})}`;
}
function joinUrl(){return location.origin+location.pathname}
function drawQR(){const el=document.getElementById('qr');if(!el||!window.QRCode)return;el.innerHTML='';new QRCode(el,{text:joinUrl(),width:220,height:220,colorDark:'#8C1D2C',colorLight:'#ffffff'})}
function downloadCSV(){
  const q=v=>'"'+String(v??'').replace(/"/g,'""')+'"';
  const rows=[['Name','Group','Market share target %','Private choices lead to %','Top ranked','Top-5 weight Self','People','Bank','Society','Safe','Stretch','Bold','Match with group %','Headline','Commitment']];
  Object.values(S.players).forEach(p=>{const w=breakdown(prefW(p),'whom'),s=breakdown(prefW(p),'size');rows.push([p.name,teamById(p.team)?.name,hasT(p.target)?p.target:'',shareOf(privateLots(p)),lotById((p.rank||[])[0])?.text,w.Self,w.People,w.Bank,w.Society,s.Safe,s.Stretch,s.Bold,alignment(p),p.headline,p.commitment])});
  rows.push([]);rows.push(['Lot','Ambition','Size','For whom','Opening bid','Market share impact %','Sold to','Price','Runner-up','Runner-up paid']);
  lots().forEach((l,i)=>{const s=(S.cfg.sold||{})[l.id]||{};rows.push([i+1,l.text,l.size,l.whom,l.open,l.impact||0,s.team?teamById(s.team)?.name:(s.price===0?'Unclaimed':''),s.price||'',s.runner?teamById(s.runner)?.name:'',s.runnerPrice||''])});
  const blob=new Blob(['\ufeff'+rows.map(r=>r.map(q).join(',')).join('\n')],{type:'text/csv'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='kumarakom-auction-results.csv';document.body.appendChild(a);a.click();a.remove();
}
</script>
